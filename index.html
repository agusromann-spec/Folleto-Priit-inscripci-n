<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <title>PRIIT Flipbook</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <!-- VISOR -->

    <div class="viewer">

        <!-- ANTERIOR -->

        <button
            id="prev"
            class="nav"
            aria-label="Página anterior">

            ❮

        </button>


        <!-- LIBRO -->

        <div id="zoomContainer">

            <div id="book"></div>

        </div>


        <!-- SIGUIENTE -->

        <button
            id="next"
            class="nav"
            aria-label="Página siguiente">

            ❯

        </button>

    </div>


    <!-- CONTROLES -->

    <div class="toolbar">

        <button
            id="zoomOut"
            class="zoomBtn"
            aria-label="Alejar">

            −

        </button>


        <span id="pageInfo">

            Cargando...

        </span>


        <button
            id="zoomIn"
            class="zoomBtn"
            aria-label="Acercar">

            +

        </button>

    </div>


    <!-- PDF.JS -->

    <script type="module">

        import * as pdfjsLib from
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.min.mjs";


        window.pdfjsLib = pdfjsLib;


        pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.168/pdf.worker.min.mjs";

    </script>


    <!-- PAGEFLIP -->

    <script src="lib/page-flip.browser.js"></script>


    <!-- NUESTRO SCRIPT -->

    <script
        type="module"
        src="script.js">
    </script>

</body>

</html>
